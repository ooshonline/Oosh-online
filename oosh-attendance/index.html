<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- OOSH Attendance moved to its own repo in 2026-10. This page only forwards old links and
       home-screen shortcuts. The new address is on the same host, so sign-in and data carry over. -->
  <meta http-equiv="refresh" content="0; url=https://ooshonline.github.io/oosh-attendance/">
  <link rel="canonical" href="https://ooshonline.github.io/oosh-attendance/">
  <meta name="robots" content="noindex">
  <title>OOSH Attendance has moved</title>
</head>
<body style="font-family:sans-serif;padding:24px">
  <p>OOSH Attendance has moved. <a href="https://ooshonline.github.io/oosh-attendance/">Open it here</a>.</p>
  <script>
    // Retire the old service worker at this address so it stops serving the old app offline.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { if (r.scope.indexOf('/Oosh-online/oosh-attendance/') !== -1) r.unregister(); });
      });
    }
    location.replace('https://ooshonline.github.io/oosh-attendance/' + location.search + location.hash);
  </script>
</body>
</html>
